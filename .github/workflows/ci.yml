# Kiểm tra tự động mỗi PR và mỗi lần push lên develop (testing-strategy mục 5).
# Không cần secret: unit test backend chỉ dùng Domain, test frontend không gọi API.
name: CI

on:
  # Không lọc nhánh base: PR xếp chồng (base là nhánh của thẻ trước) cũng chạy, và kết quả gắn với
  # commit nên vẫn còn khi PR đổi base sang develop.
  pull_request:
  push:
    branches: [develop]

permissions:
  contents: read

# Push mới lên cùng PR thì hủy lần chạy cũ đang dở. Lần chạy trên develop thì không hủy, để mỗi
# merge commit đều có kết quả.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend (build, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      # Giữ quy tắc 0 warning.
      - name: Build
        run: dotnet build --no-restore -warnaserror

      - name: Test
        run: dotnet test --no-build

  frontend:
    name: Frontend (lint, build, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      # Lấy cả repo: vietQrBanks.test.ts đọc backend/src/SmartRent.Api/Validators/VietQrBankBins.cs.
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
